# Автопроверка на каждый push и PR: типы, линтер, юнит-тесты, сборка, сквозные тесты.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Сквозные тесты на собранном сайте (без ключа OpenAI — ИИ в них не вызывается).
      - run: npx playwright install --with-deps chromium
      - run: npx next start -p 3100 &
      - run: npx wait-on -t 60000 http://localhost:3100/onboarding
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
